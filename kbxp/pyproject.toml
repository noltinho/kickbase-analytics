[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kickbase-research"
version = "0.1.0"
description = "Leakage-free research and modelling pipeline for Kickbase Tools"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
